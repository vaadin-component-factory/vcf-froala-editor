name: Build and test

on:
  push:
    branches: [ main, v1 ]
  pull_request:
    branches: [ main, v1 ]

jobs:
  build:

    runs-on: ubuntu-latest
    # a hung browser or frontend build would otherwise hold the runner for six hours
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Playwright downloads Chromium by itself, but not the system libraries it needs.
    # The version matches the Playwright dependency in e2e/pom.xml.
    - name: Install Playwright system dependencies
      run: npx --yes playwright@1.62.0 install-deps chromium

    # Unit and browserless tests in component, the Playwright tests in e2e. Vaadin removes node_modules after a
    # production build that created it, and the theme check below reads froala-editor from there.
    - name: Build and test
      run: mvn -B clean verify -Dvaadin.clean.build.frontend.files=false

    # The rules file is generated from Froala's stylesheet and committed (ADR-0007). The e2e build has just
    # installed the froala-editor package it was generated from, so running the generator again must change nothing.
    - name: Check the generated theme is up to date
      run: |
        node component/src/theme-generator/generate-vaadin-theme.js e2e/node_modules/froala-editor
        git diff --exit-code component/src/main/resources/META-INF/frontend/vcf-froala-editor/vcf-froala-theme-vaadin-rules.css

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          component/target/surefire-reports/
          e2e/target/failsafe-reports/
        retention-days: 7

  # The add-on on its own, the way it is released: without the reactor root, on the Java 17 floor (ADR-0005),
  # and with the Vaadin Directory package.
  component:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build the add-on and its Directory package
      run: mvn -B -f component/pom.xml clean install -Pdirectory

    - name: Check the Directory package exists
      run: ls component/target/vcf-froala-editor-*.zip
