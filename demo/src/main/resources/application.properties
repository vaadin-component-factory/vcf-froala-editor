# Don't pop a browser when the app starts in dev mode.
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
vaadin.frontend.hotdeploy=true
# The check-upload view posts images through FroalaUploadController; Spring caps a single file at 1 MB by
# default, which a photo passes without trying.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
