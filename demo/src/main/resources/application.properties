# Don't pop a browser when the app starts in dev mode.
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
vaadin.frontend.hotdeploy=true
# Spring caps an upload at 1 MB by default, the add-on's upload handlers included, and a photo passes that without
# trying. 10 MB is Froala's own limit for an image or a file. The request carries Froala's form fields as well.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
